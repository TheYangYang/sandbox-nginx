upstream dotnet_backend {
    server sandbox-dotnet-backend.onrender.com;
    server sandbox-dotnet-backend-1.onrender.com;
    server sandbox-dotnet-backend-2.onrender.com;
}

server {
    listen 80;

    location /ping {
        proxy_pass http://dotnet_backend;   # no trailing slash
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;                 # stop Nginx from rewriting Location headers
    }

    location / {
        proxy_pass http://dotnet_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
