# DNS resolver for HTTPS upstreams
resolver 8.8.8.8 8.8.4.4 valid=300s;
resolver_timeout 5s;

upstream dotnet_backend {
    server sandbox-dotnet-backend.onrender.com:443;
    server sandbox-dotnet-backend-1.onrender.com:443;
    server sandbox-dotnet-backend-2.onrender.com:443;
}

server {
    listen 80;

    location /ping {
        proxy_pass https://dotnet_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # TLS settings for upstream
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;        # Use the actual backend hostname from upstream
        proxy_ssl_protocols TLSv1.2 TLSv1.3;   # Ensure modern TLS

        proxy_redirect off;
    }

    location / {
        proxy_pass https://dotnet_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        proxy_redirect off;
    }
}
