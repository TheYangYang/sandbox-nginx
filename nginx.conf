# Define resolver for DNS lookups (required for HTTPS upstreams by name)
resolver 8.8.8.8 8.8.4.4 valid=300s;
resolver_timeout 5s;

# Upstream backend servers
upstream dotnet_backend {
    server sandbox-dotnet-backend.onrender.com:443;
    server sandbox-dotnet-backend-1.onrender.com:443;
    server sandbox-dotnet-backend-2.onrender.com:443;
}

# HTTP server
server {
    listen 80;

    # /ping endpoint
    location /ping {
        proxy_pass https://dotnet_backend;   # forward to upstream
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSL options for upstream
        proxy_ssl_server_name on;
        proxy_ssl_name dotnet_backend;

        proxy_redirect off;
    }

    # All other routes
    location / {
        proxy_pass https://dotnet_backend;   # forward to upstream
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_ssl_server_name on;
        proxy_ssl_name dotnet_backend;

        proxy_redirect off;
    }
}
